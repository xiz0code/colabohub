spring:
  datasource:
    url: jdbc:h2:mem:colaborapp;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      path: /h2-console
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:}
            client-secret: ${GOOGLE_CLIENT_SECRET:}

logging:
  level:
    org.hibernate.SQL: info
    org.springframework.security: info

app:
  auth:
    bootstrap-admin-email: ${BOOTSTRAP_ADMIN_EMAIL:xizocode@gmail.com}
