spring:
  application:
    name: colabohub-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      client:
        registration:
          google:
            scope:
              - openid
              - profile
              - email

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
  business-zone: ${APP_BUSINESS_ZONE:America/Santiago}
  auth:
    bootstrap-admin-email: ${APP_AUTH_BOOTSTRAP_ADMIN_EMAIL:}
