<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B78CFF"/>
      <stop offset="100%" stop-color="#8D5AE8"/>
    </linearGradient>
    <linearGradient id="tealGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#B8FFF5"/>
      <stop offset="100%" stop-color="#72DCD0"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="280" y1="0" x2="1320" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="62%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#B8FFF5"/>
    </linearGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix"
        values="1 0 0 0 0.63
                0 1 0 0 0.47
                0 0 1 0 1
                0 0 0 0.55 0"/>
    </filter>
    <filter id="tealGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="9" result="blur2"/>
      <feColorMatrix in="blur2" type="matrix"
        values="1 0 0 0 0.45
                0 1 0 0 0.94
                0 0 1 0 0.90
                0 0 0 0.55 0"/>
    </filter>
    <filter id="textGlow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur3"/>
      <feColorMatrix in="blur3" type="matrix"
        values="1 0 0 0 0.65
                0 1 0 0 0.85
                0 0 1 0 1
                0 0 0 0.48 0"/>
    </filter>
    <style>
      .wordmark {
        font-family: Inter, Poppins, Montserrat, Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.04em;
      }
    </style>
  </defs>

